<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — unusualfeminine</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-view">

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <p class="login-brand">MG</p>
      <h1>Admin</h1>
      <div id="loginFields"></div>
      <p id="loginError" hidden>Wrong email or password.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" hidden>

    <header class="admin-header">
      <span class="admin-brand">unusualfeminine <em>admin</em></span>
      <button id="logoutBtn">Logout</button>
    </header>

    <!-- STATS -->
    <div class="stats-strip">
      <div class="stat-card">
        <span id="statPaintings">—</span>
        <label>Paintings</label>
      </div>
      <div class="stat-card">
        <span id="statViews">—</span>
        <label>Total Views</label>
      </div>
      <div class="stat-card">
        <span id="statLikes">—</span>
        <label>Total Likes</label>
      </div>
    </div>

    <!-- TAB CONTENT -->
    <div class="tab-content">

      <!-- PAINTINGS -->
      <div id="tabPaintings" class="tab-panel">
        <div class="paintings-toolbar">
          <p class="paintings-hint">Click a painting to edit its details.</p>
          <div>
            <button id="seedFirestoreBtn" class="btn-add" style="background:none;border:1px solid var(--border);color:var(--muted);margin-right:0.5rem;">Import from JSON (one-time)</button>
            <button id="addPaintingBtn" class="btn-add">+ Add New Painting</button>
          </div>
        </div>
        <div id="paintingsGrid" class="paintings-admin-grid"></div>
      </div>

    </div>
  </div>

  <!-- PAINTING EDIT MODAL -->
  <div id="paintingModal" class="detail-modal" hidden>
    <div class="detail-box painting-modal-box">
      <button class="detail-close" id="paintingModalClose">&times;</button>
      <h3 id="paintingModalTitle">Edit Painting</h3>

      <div class="painting-modal-preview">
        <img id="pmPreviewImg" src="" alt="" />
        <label class="upload-label">
          <input type="file" id="pmImageFile" accept="image/*" />
          Change Image
        </label>
        <p id="pmUploadStatus" hidden></p>
        <p id="pmDupWarning" class="dup-warning" hidden>⚠️ This image is already uploaded — it won't be duplicated in storage.</p>
      </div>

      <div class="painting-modal-fields">
        <div class="pm-field">
          <label>Title</label>
          <input type="text" id="pmTitle" />
        </div>
        <div class="pm-field">
          <label>Medium</label>
          <input type="text" id="pmMedium" />
        </div>
        <div class="pm-field">
          <label>Year</label>
          <input type="number" id="pmYear" min="2000" max="2100" />
        </div>
        <div class="pm-field">
          <label>Status</label>
          <select id="pmStatus">
            <option value="available">Available</option>
            <option value="sold">Sold</option>
          </select>
        </div>
        <div class="pm-field">
          <label>Description</label>
          <textarea id="pmDescription" rows="4"></textarea>
        </div>
        <div class="pm-actions">
          <button id="pmSaveBtn" class="btn-save">Save Changes</button>
          <button id="pmDeleteBtn" class="btn-delete">Delete Painting</button>
        </div>
        <p id="pmSaveStatus" hidden></p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
